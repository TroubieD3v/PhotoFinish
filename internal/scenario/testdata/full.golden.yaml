version: 1
name: coupon-applied-twice
description: A single-use coupon must apply at most once per cart.
target: https://127.0.0.1:8443/vuln/api
tls:
  insecure: true
scope:
  allow_hosts: ['127.0.0.1:8443']
  budget: {requests: 600, rps: 50}
identities:
  alice:
    headers:
      Authorization: Bearer ${env:PF_TEST_ALICE_TOKEN}
vars:
  amount: "10"
  code: WELCOME10
setup:
  - request: POST /reset
  - id: cart
    as: alice
    request: POST /carts
    json: {}
    expect_status: [201]
    extract:
      cart_id: $.id
race:
  engine: h2
  copies: 20
  warmup: 2
  gate: 150ms
  request:
    as: alice
    raw: |
      POST /carts/{{cart_id}}/coupons HTTP/2
      Content-Type: application/json

      {"code":"{{code}}"}
check:
  as: alice
  request: GET /carts/{{cart_id}}
  invariant: |
    size(check.json.discounts) <= 1 && size(race.filter(r, r.status == 200)) <= 1
  explain: A single-use coupon must apply at most once per cart.
reset:
  - request: POST /reset
trials: 10
evidence:
  arrival_header: X-Arrival-Ns
