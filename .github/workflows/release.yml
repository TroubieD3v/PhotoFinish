name: Release

# Only version tags start a release. The moving major tag (v0) that the
# README tells action users to pin is moved by the last step of the release
# job and must not start a run of its own.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tag is a semantic version
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-pre"; exit 1
          fi
      # The web UI first: go build embeds internal/ui/dist/app, so every release
      # archive (and go test of the embedding) includes it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build
          if [ ! -f internal/ui/dist/app/index.html ]; then echo "the UI build wrote no internal/ui/dist/app/index.html"; exit 1; fi
      - run: go test ./...
      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; if [ "$os" = windows ]; then ext=".exe"; fi
            name="photofinish_${GITHUB_REF_NAME}_${os}_${arch}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/photofinish$ext" ./cmd/photofinish
            cp README.md README.ru.md LICENSE "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum -- *.tar.gz *.zip > checksums.txt)
          cat dist/checksums.txt

      # The README's walkthrough with the release binary. --window 2ms, as in
      # TestExamples: without the pause the /vuln race is only microseconds wide
      # and a slow runner could miss it in all ten trials.
      - name: Smoke-test the Linux binary
        run: |
          set -euo pipefail
          bin="dist/photofinish_${GITHUB_REF_NAME}_linux_amd64/photofinish"
          out=$("$bin" version)
          echo "$out"
          case "$out" in
            *"$GITHUB_REF_NAME"*) ;;
            *) echo "version does not mention $GITHUB_REF_NAME"; exit 1 ;;
          esac
          "$bin" demo --window 2ms --quiet > demo.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 30); do
            if curl -sk --http2 -o /dev/null https://127.0.0.1:8443/; then ready=true; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then echo "the demo shop did not start within 30s"; cat demo.log; exit 1; fi
          set +e
          "$bin" run examples/coupon-fixed.yaml
          fixed=$?
          "$bin" run examples/coupon-vuln.yaml
          vuln=$?
          set -e
          echo "coupon-fixed exit code $fixed, coupon-vuln exit code $vuln"
          if [ "$fixed" -ne 0 ] || [ "$vuln" -ne 1 ]; then echo "expected 0 and 1"; cat demo.log; exit 1; fi

      # The archives carry the web UI: serve answers / with the built SPA, not
      # with the "UI not built" page. The token is a fixed test value.
      - name: Smoke-test the web UI of the Linux binary
        env:
          PHOTOFINISH_TOKEN: release-serve-smoke-test-0123456789abcdef0123456789
        run: |
          set -euo pipefail
          bin="dist/photofinish_${GITHUB_REF_NAME}_linux_amd64/photofinish"
          mkdir -p serve-workspace
          "$bin" serve --addr 127.0.0.1:17340 --workspace serve-workspace --data :memory: > serve.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          base=http://127.0.0.1:17340
          for i in $(seq 1 30); do curl -fsS -o /dev/null "$base/api/health" && break; sleep 1; done
          curl -fsS "$base/api/health" | grep -q "$GITHUB_REF_NAME" || { echo "health does not report $GITHUB_REF_NAME"; cat serve.log; exit 1; }
          curl -fsS "$base/" > index.html || { cat serve.log; exit 1; }
          if ! grep -q 'type="module"' index.html || grep -q 'make ui' index.html; then
            echo "the release binary does not embed the UI:"; cat index.html; exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section ## [$version]"; exit 1
          fi
          printf '\n**Downloads**: one static binary per platform (Linux, macOS, Windows) with the web UI embedded, README.md, README.ru.md and LICENSE. Verify with `checksums.txt`. Docker: `docker pull ghcr.io/troubied3v/photofinish:%s`.\n' "$version" >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: PhotoFinish ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # uses: TroubieD3v/PhotoFinish@v0 follows the newest v0.x.y release.
      # Prereleases and patches of an older minor leave the tag where it is.
      # A tag pushed with GITHUB_TOKEN starts no workflow.
      - name: Move the major tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          major="${GITHUB_REF_NAME%%.*}"
          newest="$(git ls-remote --tags --refs origin "refs/tags/${major}.*" \
            | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME is not the newest $major release ($newest); $major stays"
            exit 0
          fi
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
          echo "$major now points at $GITHUB_REF_NAME"

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile cross-compiles on the build platform, so no emulation is needed.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          # Annotations on the index too: GHCR reads the description of a
          # multi-arch image from there.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/troubied3v/photofinish
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=PhotoFinish
            org.opencontainers.image.description=Proves race conditions in web APIs with the HTTP/2 single-packet attack
            org.opencontainers.image.source=https://github.com/TroubieD3v/PhotoFinish
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=PhotoFinish
            org.opencontainers.image.description=Proves race conditions in web APIs with the HTTP/2 single-packet attack
            org.opencontainers.image.source=https://github.com/TroubieD3v/PhotoFinish
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - name: Pushed image runs
        run: |
          set -euo pipefail
          out=$(docker run --rm "ghcr.io/troubied3v/photofinish:${GITHUB_REF_NAME#v}" version)
          echo "$out"
          case "$out" in
            *"$GITHUB_REF_NAME"*) ;;
            *) echo "version does not mention $GITHUB_REF_NAME"; exit 1 ;;
          esac
